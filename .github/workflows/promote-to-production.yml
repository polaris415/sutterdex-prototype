name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm deployment to production'
        required: true
        default: ''

jobs:
  promote:
    name: Merge dev → production
    runs-on: ubuntu-latest

    # Only run if confirmation input matches
    if: github.event.inputs.confirm == 'promote'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into production
        run: |
          git checkout production
          git merge --no-ff origin/dev -m "chore: promote dev → production [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin production

      - name: Summary
        run: |
          echo "✅ Successfully promoted dev → production"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Time: $(date -u '+%Y-%m-%d %H:%M UTC')"
